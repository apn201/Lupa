# /etc/apache2/sites-available/lupa.conf  (Debian/Ubuntu layout)
# Needs: a2enmod proxy proxy_http headers ssl rewrite
# Replace lupa.example.com with the real host name. certbot --apache adds the :443 block.
<VirtualHost *:80>
    ServerName lupa.example.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8710/
    ProxyPassReverse / http://127.0.0.1:8710/
    RequestHeader set X-Forwarded-Proto "http"

    # The agent header is only meaningful from MCP clients; it is not authentication.
    # Keep request bodies small; the API never needs more.
    LimitRequestBody 65536

    ErrorLog ${APACHE_LOG_DIR}/lupa_error.log
    CustomLog ${APACHE_LOG_DIR}/lupa_access.log combined
</VirtualHost>
