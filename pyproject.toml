[project]
name = "lupa"
version = "0.1.0"
description = "Consumer Payment Authorization API prototype on the PayPal sandbox"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
  "openai>=1.40",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "hypothesis>=6", "pytest-cov>=5"]
mcp = ["mcp>=2.3"]

[tool.setuptools.packages.find]
include = ["lupa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
